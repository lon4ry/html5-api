<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практическая работа по разделу 5</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 30px auto; padding: 0 16px; background: #f6f7f9; color: #222; }
    section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
    h2 { margin-top: 6px; }
    button { padding: 7px 14px; margin: 6px 6px 0 0; cursor: pointer; border: 1px solid #2a7ae2; border-radius: 4px; background: #2a7ae2; color: #fff; }
    button.secondary { background: #fff; color: #2a7ae2; }
    button:disabled { opacity: 0.5; cursor: default; }
    #dropZone { border: 2px dashed #9ab; border-radius: 8px; padding: 36px 16px; text-align: center; color: #678; margin-top: 10px; transition: background 0.2s, border-color 0.2s; }
    #dropZone.over { border-color: #2a7ae2; background: #eef5ff; color: #2a7ae2; }
    progress { width: 100%; height: 14px; margin-top: 8px; }
    .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
    .file { border: 1px solid #ddd; border-radius: 6px; padding: 8px; overflow: hidden; }
    .file .name { font-weight: bold; word-break: break-all; }
    .file .meta { color: #777; font-size: 12px; margin: 2px 0 6px; }
    .file img, .file video { width: 100%; max-height: 180px; object-fit: contain; background: #f0f0f0; display: block; }
    .file audio { width: 100%; }
    .file pre { max-height: 180px; overflow: auto; background: #f6f6f6; padding: 6px; margin: 0; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    .devices { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    #camera, #photo { width: 100%; background: #000; border-radius: 6px; display: block; margin-top: 10px; }
    #camera { aspect-ratio: 4 / 3; }
    #camera[hidden], #photo[hidden] { display: none; }
    .status { min-height: 20px; margin: 8px 0 0; }
    .error { color: #c00; }
    .success { color: #080; }
    .info { color: #555; }
    table { border-collapse: collapse; margin-top: 8px; }
    td { padding: 3px 12px 3px 0; }
  </style>
</head>
<body>
  <h1>Практическая работа по разделу 5</h1>

  <!-- 1–2. FileReader API и Drag and Drop API -->
  <section>
    <h2>1. Загрузка файлов: FileReader и Drag and Drop</h2>
    <button id="chooseBtn">Выбрать файлы</button>
    <button class="secondary" id="clearFilesBtn">Очистить</button>
    <input type="file" id="fileInput" multiple hidden>
    <div id="dropZone">Перетащите файлы сюда: изображения, текст, аудио, видео</div>
    <progress id="readProgress" value="0" max="100" hidden></progress>
    <p class="status" id="fileStatus"></p>
    <div class="files" id="fileList"></div>
  </section>

  <!-- 3. Управление устройствами -->
  <section>
    <h2>2. Устройства</h2>
    <div class="devices">
      <div>
        <h3>Геолокация</h3>
        <button id="locateBtn">Определить местоположение</button>
        <table id="geoTable" hidden>
          <tr><td>Широта</td><td id="lat"></td></tr>
          <tr><td>Долгота</td><td id="lon"></td></tr>
          <tr><td>Точность</td><td id="accuracy"></td></tr>
          <tr><td>Карта</td><td><a id="mapLink" target="_blank" rel="noopener">OpenStreetMap</a></td></tr>
        </table>
        <p class="status" id="geoStatus"></p>
      </div>
      <div>
        <h3>Веб-камера</h3>
        <button id="cameraBtn">Включить камеру</button>
        <button id="photoBtn" disabled>Сделать фото</button>
        <button class="secondary" id="stopCameraBtn" disabled>Выключить</button>
        <button class="secondary" id="savePhotoBtn" disabled>Сохранить фото</button>
        <video id="camera" autoplay playsinline muted hidden></video>
        <canvas id="photo" hidden></canvas>
        <p class="status" id="cameraStatus"></p>
      </div>
    </div>
  </section>

  <script>
    const MAX_FILE_SIZE = 50 * 1024 * 1024;
    const MAX_TEXT_LENGTH = 5000;
    const TEXT_EXTENSIONS = /\.(txt|md|csv|json|js|css|html|xml|log)$/i;

    function setStatus(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'status ' + (type || '');
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' Б';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
      return (bytes / 1024 / 1024).toFixed(2) + ' МБ';
    }

    // 1. FileReader API: способ чтения зависит от типа файла
    function readFile(file, method) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        const progress = document.getElementById('readProgress');
        reader.onprogress = e => {
          if (e.lengthComputable) progress.value = Math.round(e.loaded / e.total * 100);
        };
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader[method](file);
      });
    }

    function isText(file) {
      return file.type.startsWith('text/') || file.type === 'application/json' || TEXT_EXTENSIONS.test(file.name);
    }

    async function createPreview(file) {
      const card = document.createElement('div');
      card.className = 'file';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = file.name;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = (file.type || 'неизвестный тип') + ', ' + formatSize(file.size);
      card.append(name, meta);

      const media = ['image', 'audio', 'video'].find(type => file.type.startsWith(type + '/'));
      if (media === 'image') {
        const img = document.createElement('img');
        img.alt = file.name;
        img.src = await readFile(file, 'readAsDataURL');
        // Файл с типом image/* может оказаться битым или неподдерживаемым (например, HEIC)
        await img.decode().catch(() => { throw new Error('браузер не может показать изображение'); });
        card.append(img);
      } else if (media) {
        const el = document.createElement(media);
        el.controls = true;
        el.src = await readFile(file, 'readAsDataURL');
        card.append(el);
      } else if (isText(file)) {
        // Читается только начало файла: показываем не больше MAX_TEXT_LENGTH символов
        const text = await readFile(file.slice(0, MAX_TEXT_LENGTH * 4), 'readAsText');
        const pre = document.createElement('pre');
        pre.textContent = file.size > MAX_TEXT_LENGTH * 4 || text.length > MAX_TEXT_LENGTH
          ? text.slice(0, MAX_TEXT_LENGTH) + '\n…'
          : text;
        card.append(pre);
      } else {
        // Для остальных файлов показываем первые байты в шестнадцатеричном виде
        const buffer = await readFile(file.slice(0, 64), 'readAsArrayBuffer');
        const pre = document.createElement('pre');
        pre.textContent = Array.from(new Uint8Array(buffer), b => b.toString(16).padStart(2, '0')).join(' ');
        card.append(pre);
      }
      return card;
    }

    // Пакеты файлов обрабатываются по очереди; «Очистить» увеличивает поколение,
    // и карточки из уже начатого чтения в очищенный список не попадают
    let queue = Promise.resolve();
    let generation = 0;

    function handleFiles(files) {
      if (!files.length) return;
      const gen = generation;
      queue = queue
        .then(() => processFiles(files, gen))
        .catch(err => setStatus('fileStatus', 'Ошибка: ' + err.message, 'error'));
    }

    async function processFiles(files, gen) {
      if (gen !== generation) return;
      const progress = document.getElementById('readProgress');
      const list = document.getElementById('fileList');
      let loaded = 0;
      const failed = [];

      progress.hidden = false;
      for (const file of files) {
        progress.value = 0;
        setStatus('fileStatus', 'Чтение: ' + file.name, 'info');
        if (file.size > MAX_FILE_SIZE) {
          failed.push(file.name + ' (больше ' + formatSize(MAX_FILE_SIZE) + ')');
          continue;
        }
        try {
          const card = await createPreview(file);
          if (gen !== generation) break;
          list.prepend(card);
          loaded++;
        } catch (err) {
          failed.push(file.name + ' (' + (err.message || 'ошибка чтения') + ')');
        }
      }
      progress.hidden = true;
      if (gen !== generation) return;

      if (failed.length) {
        setStatus('fileStatus', 'Загружено: ' + loaded + '. Ошибки: ' + failed.join(', '), 'error');
      } else {
        setStatus('fileStatus', 'Файлы успешно загружены: ' + loaded, 'success');
      }
    }

    const fileInput = document.getElementById('fileInput');
    document.getElementById('chooseBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      handleFiles(Array.from(fileInput.files));
      fileInput.value = '';
    });

    document.getElementById('clearFilesBtn').addEventListener('click', () => {
      generation++;
      document.getElementById('fileList').innerHTML = '';
      setStatus('fileStatus', '');
    });

    // 2. Drag and Drop API
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragenter', e => {
      e.preventDefault();
      dropZone.classList.add('over');
    });
    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });
    dropZone.addEventListener('dragleave', e => {
      if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('over');
    });
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('over');
      const files = Array.from(e.dataTransfer.files);
      if (!files.length) {
        setStatus('fileStatus', 'Перетащите файлы, а не текст или ссылку', 'error');
        return;
      }
      handleFiles(files);
    });

    // Файл, брошенный мимо зоны, не должен открываться вместо страницы
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => e.preventDefault());

    // 3. Геолокация
    const GEO_ERRORS = {
      1: 'Доступ к местоположению запрещён пользователем',
      2: 'Не удалось определить местоположение',
      3: 'Превышено время ожидания'
    };

    document.getElementById('locateBtn').addEventListener('click', () => {
      if (!navigator.geolocation) {
        setStatus('geoStatus', 'Геолокация не поддерживается браузером', 'error');
        return;
      }
      setStatus('geoStatus', 'Определение местоположения…', 'info');
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude, accuracy } = pos.coords;
          document.getElementById('lat').textContent = latitude.toFixed(6);
          document.getElementById('lon').textContent = longitude.toFixed(6);
          document.getElementById('accuracy').textContent = Math.round(accuracy) + ' м';
          document.getElementById('mapLink').href =
            'https://www.openstreetmap.org/?mlat=' + latitude + '&mlon=' + longitude + '#map=16/' + latitude + '/' + longitude;
          document.getElementById('geoTable').hidden = false;
          setStatus('geoStatus', 'Местоположение получено', 'success');
        },
        err => setStatus('geoStatus', GEO_ERRORS[err.code] || err.message, 'error'),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    });

    // 3. Веб-камера: Media Devices API
    const camera = document.getElementById('camera');
    const photo = document.getElementById('photo');
    let stream = null;

    const CAMERA_ERRORS = {
      NotAllowedError: 'Доступ к камере запрещён',
      NotFoundError: 'Камера не найдена',
      NotReadableError: 'Камера занята другим приложением',
      OverconstrainedError: 'Камера не поддерживает нужные параметры',
      SecurityError: 'Камера доступна только по HTTPS или на localhost'
    };

    function setCameraState(on) {
      document.getElementById('cameraBtn').disabled = on;
      document.getElementById('photoBtn').disabled = !on;
      document.getElementById('stopCameraBtn').disabled = !on;
      camera.hidden = !on;
    }

    document.getElementById('cameraBtn').addEventListener('click', async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('cameraStatus', 'Браузер не поддерживает доступ к камере или страница открыта не по HTTPS', 'error');
        return;
      }
      // Кнопка блокируется сразу, иначе повторный клик запустит второй поток, который не остановить
      document.getElementById('cameraBtn').disabled = true;
      setStatus('cameraStatus', 'Запрос доступа к камере…', 'info');
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
        camera.srcObject = stream;
        setCameraState(true);
        setStatus('cameraStatus', 'Камера включена', 'success');
        // Камеру отключили или отозвали разрешение
        stream.getVideoTracks()[0].addEventListener('ended', () => {
          stopCamera();
          setStatus('cameraStatus', 'Камера отключилась', 'error');
        });
      } catch (err) {
        document.getElementById('cameraBtn').disabled = false;
        setStatus('cameraStatus', CAMERA_ERRORS[err.name] || 'Ошибка камеры: ' + err.message, 'error');
      }
    });

    function stopCamera() {
      if (!stream) return;
      stream.getTracks().forEach(track => track.stop());
      stream = null;
      camera.srcObject = null;
      setCameraState(false);
    }

    document.getElementById('photoBtn').addEventListener('click', () => {
      if (!camera.videoWidth) {
        setStatus('cameraStatus', 'Видео с камеры ещё не готово', 'error');
        return;
      }
      photo.width = camera.videoWidth;
      photo.height = camera.videoHeight;
      photo.getContext('2d').drawImage(camera, 0, 0);
      photo.hidden = false;
      document.getElementById('savePhotoBtn').disabled = false;
      setStatus('cameraStatus', 'Фото сделано: ' + photo.width + '×' + photo.height, 'success');
    });

    document.getElementById('stopCameraBtn').addEventListener('click', () => {
      stopCamera();
      setStatus('cameraStatus', 'Камера выключена', 'info');
    });

    document.getElementById('savePhotoBtn').addEventListener('click', () => {
      photo.toBlob(blob => {
        if (!blob) {
          setStatus('cameraStatus', 'Не удалось сохранить фото', 'error');
          return;
        }
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'photo-' + Date.now() + '.png';
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        setStatus('cameraStatus', 'Фото сохранено: ' + link.download, 'success');
      }, 'image/png');
    });
  </script>
</body>
</html>
